name: Backend CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: anhvty/mern-todo-be

defaults:
  run:
    shell: bash

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Build backend image
        run: docker build --tag "$IMAGE:$GITHUB_SHA" .

      - name: Test registration and login with MongoDB
        run: |
          docker network create todo-ci
          docker run -d --name mongo-ci --network todo-ci \
            mongodb/mongodb-community-server:8.0-ubi8

          timeout 90s bash -c 'until docker exec mongo-ci mongosh --quiet \
            --eval "db.adminCommand({ ping: 1 })" >/dev/null 2>&1; do sleep 2; done'

          docker run -d --name backend-ci --network todo-ci \
            -p 127.0.0.1:8000:8000 \
            -e PORT=8000 \
            -e MONGO_URI=mongodb://mongo-ci:27017/mern_todo_ci \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            "$IMAGE:$GITHUB_SHA"

          curl --silent --show-error --max-time 5 --retry-max-time 60 \
            --retry 20 --retry-delay 2 --retry-all-errors \
            http://127.0.0.1:8000/api/user/getuser -o /dev/null

          curl --fail --silent --show-error --max-time 45 \
            -H 'Content-Type: application/json' \
            --data '{"name":"CI Demo","email":"ci@example.com","password":"CiTodo@2026"}' \
            http://127.0.0.1:8000/api/user/register \
            | jq -e '.token | strings | length > 0' > /dev/null

          curl --fail --silent --show-error --max-time 10 \
            -H 'Content-Type: application/json' \
            --data '{"email":"ci@example.com","password":"CiTodo@2026"}' \
            http://127.0.0.1:8000/api/user/login \
            | jq -e '.token | strings | length > 0' > /dev/null

      - name: Show container logs on failure
        if: failure()
        run: |
          docker logs mongo-ci || true
          docker logs backend-ci || true

      - name: Sign in to Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: anhvty
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: docker push "$IMAGE:$GITHUB_SHA"
